upstream watchtower_servers {
    server WEB01_IP max_fails=2 fail_timeout=10s;
    server WEB02_IP max_fails=2 fail_timeout=10s;

}
server { 
    listen 80 default_server;
    location / {
        proxy_pass http://watchtower_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        
    }
}