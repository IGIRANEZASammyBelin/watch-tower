upstream watchtower_servers {
    server 18.133.245.231 max_fails=2 fail_timeout=10s;
    server 18.130.235.146 max_fails=2 fail_timeout=10s;

}
server {
    listen 80 default_server;
    server_name_;
    location / { 
        proxy_pass http://watchtower_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remot_addr;
        proxy_next_upstream error timeout http_502 http_503;
        
    }
}