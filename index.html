<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Watchtower - East Africa Airstrip Weather</title>
        <link rel="stylesheet" href="styles.css">


    </head>
    <body>
        <header>
            <h1>WATCHTOWER</h1>
            <p>Live weather and flight chattering Advisory in East Africa</p>

        </header>
        <section class="controls" aria-label="Filter and Flight Time Controls">
            <input type="text" id="search" placeholder="search airstrip">
            <select id="countryFilter">
                <option value="">All countries</option>
                <option value="Rwanda">Rwanda</option>
                <option value="Uganda">Uganda</option>
                <option value="Burundi">Burundi</option>
                <option value="DR Congo">DR Congo</option>
                <option value="Tanzania">Tanzania</option>
                <option value="Kenya">Kenya</option>

            </select>
            <select id="conditions">
                <option value="">All conditions</option>
                <option value="Sunny">Sunny</option>
                <option value="Rainy">Rainy</option>
                <option value="Foggy">Foggy</option>
                <option value="Strong winds">Strong winds</option>
                <option value="Natural Disaster Alert">Natural Disaster Alert</option>

            </select>
            <select id="flightTime" title="Select your planned departure">
                <option value="0">Depart: Now (live)</option>
                <option value="3">Depart: +3 Hours</option>
                <option value="6">Depart: +6 Hours</option>
                <option value="12">Depart: +12 Hours</option>
                <option value="24">Depart: +24 Hours</option>
            </select>
            <select id="sortBy">
                <option value="risk">Sort by Risk (highest)</option>
                <option  value="name">Sort by Name</option>
                <option value="temperature">sort by Temperature</option>
                <option value="wind">Sort by Wind speed</option>
            </select>
            <button id="refresh" type="button">Refresh</button>

        </section>
        <p id="status" aria-live="polite"></p>
        <main id="results" class="results"></main>
        <footer>
            <p>
                Weather data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
                Watch tower provides General Advisory and doesn't replace offical weather broadcasting or traffic control
            </p>
        </footer>
        <script src="web.js"></script>
    </body>
</html>
